[package]
name = "aethel-memory-rust"
version = "0.1.0"
edition = "2021"
description = "Núcleo trazable de memoria y consolidación para Aethel"

[lib]
path = "src/lib.rs"

[[bin]]
name = "aethel-memory-rust"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
